<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedidos | Cafetería</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="../js/pedidos.js" defer></script>
</head>
<body class="bg-light">
  <main class="container py-4">
    <h1 class="h3 fw-bold text-center mb-4">Gestión de pedidos de la cafetería</h1>

    <!-- Formulario de registro -->
    <section class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <h2 class="h5 fw-bold">Nuevo pedido</h2>
        <form id="formPedido" novalidate>
          <div class="row g-3">
            <div class="col-md-5">
              <label for="producto" class="form-label fw-semibold">Producto</label>
              <input type="text" class="form-control" id="producto" placeholder="Ej. Café americano" required>
              <div class="invalid-feedback">Ingresa el nombre del producto.</div>
            </div>
            <div class="col-md-3">
              <label for="precio" class="form-label fw-semibold">Precio unitario ($)</label>
              <input type="number" class="form-control" id="precio" step="0.01" placeholder="2.50" required>
              <div class="invalid-feedback">El precio debe ser mayor que cero.</div>
            </div>
            <div class="col-md-2">
              <label for="cantidad" class="form-label fw-semibold">Cantidad</label>
              <input type="number" class="form-control" id="cantidad" step="1" placeholder="3" required>
              <div class="invalid-feedback">Debe ser un entero positivo.</div>
            </div>
            <div class="col-md-2 d-flex align-items-start pt-md-4 mt-md-2">
              <button type="submit" class="btn btn-primary w-100">Agregar pedido</button>
            </div>
          </div>
        </form>
        <div id="mensaje" class="mt-3" role="status" aria-live="polite"></div>
      </div>
    </section>

    <!-- Filtro y acciones -->
    <section class="row g-2 align-items-end mb-3">
      <div class="col-md-3">
        <label for="precioMaximo" class="form-label fw-semibold">Precio máximo ($)</label>
        <input type="number" class="form-control" id="precioMaximo" step="0.01" placeholder="3.00">
      </div>
      <div class="col-md-3">
        <button type="button" class="btn btn-outline-primary w-100" id="btnFiltrar">Filtrar productos</button>
      </div>
      <div class="col-md-3">
        <button type="button" class="btn btn-outline-secondary w-100" id="btnMostrarTodos">Mostrar todos</button>
      </div>
      <div class="col-md-3">
        <button type="button" class="btn btn-outline-danger w-100" id="btnLimpiar">Limpiar pedidos</button>
      </div>
    </section>

    <!-- Tabla de pedidos -->
    <div class="table-responsive">
      <table class="table table-striped table-bordered bg-white">
        <thead class="table-dark">
          <tr>
            <th scope="col">Producto</th>
            <th scope="col">Precio unitario</th>
            <th scope="col">Cantidad</th>
            <th scope="col">Subtotal</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
      </table>
    </div>

    <!-- Indicadores -->
    <div class="row text-center">
      <div class="col-md-6">
        <div class="alert alert-info">Total de unidades: <strong id="totalUnidades">0</strong></div>
      </div>
      <div class="col-md-6">
        <div class="alert alert-success">Monto total: <strong id="montoTotal">$0.00</strong></div>
      </div>
    </div>

    <a href="../index.html" class="btn btn-primary w-100">Regresar</a>
  </main>
</body>
</html>
